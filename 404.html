<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — VEYRO</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="veyro-icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #0a0a0a;
    --ink: #f2f2ef;
    --ink-soft: #8f8f8a;
    --line: #2a2a28;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
  }
  .code {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(4rem, 12vw, 8rem);
    line-height: 1;
    letter-spacing: -0.02em;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 1.5rem;
    margin-top: 1rem;
    margin-bottom: 0.75rem;
  }
  p {
    color: var(--ink-soft);
    font-size: 0.95rem;
    margin-bottom: 2rem;
    max-width: 40ch;
  }
  a.home {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    text-decoration: none;
    color: var(--ink);
    border-bottom: 1px solid var(--ink);
    padding-bottom: 0.2rem;
    font-size: 0.9rem;
    transition: color 0.25s, border-color 0.25s;
  }
  a.home:hover { color: var(--ink-soft); border-color: var(--ink-soft); }
</style>
</head>
<body>
  <div class="code">404</div>
  <h1>This page doesn't exist</h1>
  <p>The page you're looking for may have moved or never existed. Let's get you back on track.</p>
  <a class="home" href="/">← Back to VEYRO</a>
</body>
</html>
